name: Client

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/client.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (vérifie aussi les types TypeScript)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
