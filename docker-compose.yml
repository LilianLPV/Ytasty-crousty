services:
  db:
    image: postgres:16
    container_name: ytasty-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ytasty_db
    ports:
      - '5432:5432'
        # La ou on va stocker notre bdd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ytasty_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: ytasty-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:${POSTGRES_PASSWORD}@db:5432/ytasty_db
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
# Docker créer et gérer cette espace de stockage
volumes:
  postgres_data: